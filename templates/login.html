<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <title>Login</title>
  </head>
  <body class="flex items-center justify-center h-screen">
    <form method="post" class="bg-white p-6 rounded shadow">
      {% if error %}<p class="text-red-500">{{ error }}</p>{% endif %}
      <input type="text" name="username" placeholder="Username" class="border p-2 mb-2 w-full">
      <input type="password" name="password" placeholder="Password" class="border p-2 mb-2 w-full">
      <button class="bg-blue-500 text-white px-4 py-2">Login</button>
    </form>
  </body>
</html>
